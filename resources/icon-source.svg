<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11221B" />
      <stop offset="100%" stop-color="#091410" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6C987" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#9A7821" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(212,175,55,0.22)" />
      <stop offset="100%" stop-color="rgba(212,175,55,0)" />
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow)" />
  <!-- Outer decorative Islamic arch ring -->
  <circle cx="256" cy="256" r="188" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="12 8" opacity="0.6" />
  <circle cx="256" cy="256" r="168" fill="#162B23" stroke="url(#goldGrad)" stroke-width="6" />
  <!-- Tasbih beads stylized circle -->
  <circle cx="256" cy="72" r="10" fill="#D4AF37" />
  <circle cx="386" cy="126" r="8" fill="#D4AF37" opacity="0.8" />
  <circle cx="440" cy="256" r="8" fill="#D4AF37" opacity="0.8" />
  <circle cx="386" cy="386" r="8" fill="#D4AF37" opacity="0.8" />
  <circle cx="256" cy="440" r="8" fill="#D4AF37" opacity="0.8" />
  <circle cx="126" cy="386" r="8" fill="#D4AF37" opacity="0.8" />
  <circle cx="72" cy="256" r="8" fill="#D4AF37" opacity="0.8" />
  <circle cx="126" cy="126" r="8" fill="#D4AF37" opacity="0.8" />
  <!-- Inner tactile counter disc -->
  <circle cx="256" cy="256" r="118" fill="#0D1E17" stroke="url(#goldGrad)" stroke-width="3" />
  <!-- Persian numbers 33 inside -->
  <text x="256" y="286" font-family="Vazirmatn, sans-serif" font-size="94" font-weight="800" fill="#F3F7F4" text-anchor="middle">۳۳</text>
</svg>
